name: Release

# Push a version tag from master to publish a signed APK, for example:
#   git tag v1.2.0 && git push origin v1.2.0
# A tag vX.Y.Z-rc.N is published as a prerelease. The notes are the version's CHANGELOG.md
# section, or GitHub's generated notes when there is none.
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The tag is vX.Y.Z or vX.Y.Z-<prerelease> and its commit is on master.
  check:
    uses: RangelReale/personal-ai-rules/.github/workflows/release-check.yml@v0.5.1

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set. See README, section Releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ vars.RELEASE_KEY_ALIAS || 'rrgmc' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.check.outputs.version }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease -PappVersion="$VERSION"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Name the APK
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/android-dev-settings-$TAG.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/
          if-no-files-found: error

  # Attaches the release-* artifacts and a SHA256SUMS.txt.
  publish:
    needs: [check, build]
    permissions:
      contents: write
    uses: RangelReale/personal-ai-rules/.github/workflows/release-publish.yml@v0.5.1
    with:
      tag: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      prerelease: ${{ needs.check.outputs.prerelease }}
      title: ${{ needs.check.outputs.tag }}
