# personal-rules: what this repository opted into. /personal-rules:check audits against it, and
# the always-on rules read `stage` to decide how work reaches master.
version: 0.5.1              # personal-rules version last applied
stage: established          # early: merge locally, no CI | established: PR-only master, CI result required
language: android           # the main language, which holds the version: android | rust | go | cpp | none
features: [ci, release, changelog, license]
release-environment: ''     # signing secrets are repository secrets
# Features whose workflow the repository writes itself (ci, release): check audits what the rules
# rely on, and never replaces the file with the template.
custom: [ci, release]
ci-check: test              # the check branch protection requires
components: []
